[package]
name = "pomelo-launcher"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PomeloLauncher 桌面外壳（Tauri 2，Windows 需 MSVC 工具链）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol：让 cargo build（含 release）嵌入 dist 产物而非连接 dev server
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pomelo-core = { path = "../crates/pomelo-core" }
pomelo-downloader = { path = "../crates/pomelo-downloader" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

[workspace]
