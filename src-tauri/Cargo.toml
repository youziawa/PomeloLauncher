[workspace]
resolver = "2"
members = [
    "crates/pomelo-core",
    "crates/pomelo-downloader",
    "crates/pomelo-cli",
]
# Tauri 桌面外壳（app/）使用 MSVC 工具链单独构建，见 app/README.md
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "io-util", "sync"] }
futures = "0.3"
sha1 = "0.10"
hex = "0.4"
zip = "2"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
